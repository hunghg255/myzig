<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
<title id="title">myzig: a web page calling Zig</title>
<desc id="desc">Desktop page IPC: frontend to bridge, native webview transport, shared dispatch and bound Zig service. Replies, events and channels return through a batched outbox. TypeScript generation happens at compile time.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#2e5aa8"/></marker>
</defs>
<style>text{font-family:Geist,Arial,sans-serif;fill:#2d3142}.title{font-size:24px;font-weight:600}.name{font-size:20px;font-weight:600}.body{font-size:16px;fill:#4f5d75}.code{font-family:"Geist Mono",Consolas,monospace;font-size:16px;fill:#4f5d75}.tag{font-size:12px;letter-spacing:1px;fill:#4f5d75}</style>
<rect width="960" height="800" rx="8" fill="#f5f5f5"/>
<text x="32" y="44" class="title">Web pages: typed calls across the webview boundary</text>
<text x="32" y="76" class="body">Desktop only: WKWebView (macOS), WebKitGTK (Linux), WebView2 (Windows).</text>
<path d="M296 172H340" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M616 172H660" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M788 244V280H680V312" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M436 376H392" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M252 440V488" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M112 488V464H16V172H32" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M252 696H64V268H164V244" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="8 4"/>
<rect x="32" y="108" width="264" height="136" rx="8" fill="#f5f5f5"/>
<rect x="32" y="108" width="264" height="136" rx="8" fill="#ffffff" stroke="#2d3142"/>
<text x="52" y="140" class="name">Frontend</text>
<text x="52" y="168" class="body">Generated myzig.js client</text>
<text x="52" y="192" class="code">myzig.d.ts type checking</text>
<text x="52" y="216" class="body">HTML / CSS / JavaScript</text>
<rect x="340" y="108" width="276" height="136" rx="8" fill="#f5f5f5"/>
<rect x="340" y="108" width="276" height="136" rx="8" fill="#fce9df" stroke="#eb6c36"/>
<text x="360" y="140" class="name">Page runtime</text>
<text x="360" y="168" class="code">src/bridge.js</text>
<text x="360" y="192" class="body">window.myzig</text>
<text x="360" y="216" class="body">Call IDs → Promise results</text>
<rect x="660" y="108" width="268" height="136" rx="8" fill="#f5f5f5"/>
<rect x="660" y="108" width="268" height="136" rx="8" fill="#ffffff" stroke="#2d3142"/>
<text x="680" y="140" class="name">Native transport</text>
<text x="680" y="168" class="body">Webview postMessage</text>
<text x="680" y="192" class="body">Platform Page adapter</text>
<text x="680" y="216" class="body">JSON messages</text>
<rect x="436" y="312" width="492" height="128" rx="8" fill="#f5f5f5"/>
<rect x="436" y="312" width="492" height="128" rx="8" fill="#ffffff" stroke="#2d3142"/>
<text x="456" y="344" class="name">Shared IPC dispatch</text>
<text x="456" y="372" class="code">src/ipc.zig / bindings.zig</text>
<text x="456" y="396" class="body">Trust check → decode → method dispatch</text>
<text x="456" y="420" class="body">Bound methods run on the main thread</text>
<rect x="112" y="312" width="280" height="128" rx="8" fill="#f5f5f5"/>
<rect x="112" y="312" width="280" height="128" rx="8" fill="#ffffff" stroke="#2d3142"/>
<text x="132" y="344" class="name">Your Zig service</text>
<text x="132" y="372" class="code">app.bind(&amp;service)</text>
<text x="132" y="396" class="body">Typed method arguments</text>
<text x="132" y="420" class="body">Return value or error</text>
<rect x="112" y="488" width="816" height="104" rx="8" fill="#f5f5f5"/>
<rect x="112" y="488" width="816" height="104" rx="8" fill="#ffffff" stroke="#2d3142"/>
<text x="132" y="520" class="name">Per-page outbox → native evaluation → bridge receive</text>
<text x="132" y="548" class="body">Replies, events and channel values are batched once per main-loop turn.</text>
<text x="132" y="572" class="code">__myzig.receive([...]) settles calls and delivers messages.</text>
<rect x="252" y="648" width="676" height="96" rx="8" fill="#f5f5f5"/>
<rect x="252" y="648" width="676" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-dasharray="4 4"/>
<text x="272" y="680" class="name">Compile-time client generation</text>
<text x="272" y="708" class="code">tsgen.zig + bindings.zig / myzig.js + myzig.d.ts</text>
<text x="32" y="620" class="body">Runtime return path goes back to the frontend; generation is separate from message dispatch.</text>
<path d="M32 760H928" stroke="#bfc0c0"/>
<text x="32" y="788" class="body">Solid arrows: runtime messages. Dashed arrow / box: generated client supplied to the frontend.</text>
</svg>
